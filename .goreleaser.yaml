version: 2

project_name: autoreview

builds:
  - id: autoreview
    main: ./cmd/autoreview
    binary: autoreview
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/uinaf/autoreview/internal/buildinfo.version={{ .Tag }}
      - -X github.com/uinaf/autoreview/internal/buildinfo.commit={{ .FullCommit }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: autoreview
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  disable: true

release:
  github:
    owner: uinaf
    name: autoreview
  mode: append
  replace_existing_artifacts: true
  prerelease: auto

homebrew_casks:
  - name: autoreview
    ids:
      - autoreview
    binaries:
      - autoreview
    repository:
      owner: uinaf
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    commit_author:
      name: uinaf-release-bot[bot]
      email: 312581908+uinaf-release-bot[bot]@users.noreply.github.com
    commit_msg_template: "chore(autoreview): update to {{ .Tag }}"
    homepage: https://github.com/uinaf/autoreview
    description: Structured independent code review CLI
    license: MIT
    dependencies:
      - formula: git
      - formula: trufflehog
    url:
      verified: github.com/uinaf/autoreview/
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/autoreview"]
          end
