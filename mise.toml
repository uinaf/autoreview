[settings]
jobs = 1

[tools]
actionlint = "1.7.12"
go = "1.26.2"
goreleaser = "2.17.1"
rg = "15.2.0"
shellcheck = "0.11.0"
trufflehog = "3.96.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"

[env]
GOWORK = "off"

[tasks.fmt]
description = "Format Go sources"
run = "gofmt -w ."

[tasks."fmt:check"]
description = "Check Go source formatting"
run = "test -z \"$(gofmt -l .)\""

[tasks.test]
description = "Run unit tests"
# Git-backed tests spawn many subprocesses; cap parallelism to avoid process exhaustion.
run = "go test -p 4 -parallel 4 ./..."

[tasks."test:race"]
description = "Run unit tests with the race detector"
# macOS TSan can crash when multiple Git subprocess tests run concurrently.
run = "go test -race -p 1 -parallel 1 ./..."

[tasks.vet]
description = "Run Go static analysis"
run = "go vet ./..."

[tasks.build]
description = "Build the autoreview CLI"
run = "go build ./cmd/autoreview"

[tasks.verify]
description = "Run deterministic repository verification"
depends = ["fmt:check", "test", "test:race", "vet", "build", "installer:check", "skill:publish:check"]

[tasks."installer:test"]
description = "Run the offline Linux installer fixture tests"
run = "bash scripts/test-install.sh"

[tasks."installer:check"]
description = "Validate the Linux installer"
depends = ["installer:test"]
run = '''
set -e
sh -n install.sh
bash -n scripts/test-install.sh
shellcheck -s sh install.sh
shellcheck -s bash scripts/test-install.sh
'''

[tasks."test:integration"]
description = "Run CLI and scanner integration tests"
run = '''
set -e
command -v trufflehog >/dev/null || {
  printf '%s\n' "test:integration requires the trufflehog executable on PATH" >&2
  exit 1
}
go test ./cmd/autoreview -run '^TestBinaryEndToEndWithFakeCodex$' -count=1
AUTOREVIEW_REAL_TRUFFLEHOG=1 \
  go test ./internal/target \
  -run '^Test(TruffleHogScanner.*|CollectorDetectsCredentialInDeletedFile)$' \
  -count=1 -v
(cd testdata/v0.1-fixture/after && go test ./...)
'''

[tasks."test:current-checkout"]
description = "Opt in to freezing and scanning the current checkout"
run = '''
AUTOREVIEW_REAL_REPOSITORY=1 \
  go test ./internal/target \
  -run '^TestCollectorRealRepositorySmoke$' \
  -count=1 -v
'''

[tasks.vuln]
description = "Check reachable Go vulnerabilities"
run = "govulncheck ./..."

[tasks."build:cross"]
description = "Cross-compile supported source targets"
run = '''
set -e
GOOS=darwin GOARCH=amd64 go build -o /tmp/autoreview-darwin-amd64 ./cmd/autoreview
GOOS=darwin GOARCH=arm64 go build -o /tmp/autoreview-darwin-arm64 ./cmd/autoreview
GOOS=linux GOARCH=amd64 go build -o /tmp/autoreview-linux-amd64 ./cmd/autoreview
GOOS=linux GOARCH=arm64 go build -o /tmp/autoreview-linux-arm64 ./cmd/autoreview
'''

[tasks."runtime:go-only"]
description = "Reject Python runtime files and invocation"
run = '''
set -e
test -z "$(git ls-files '*.py' '*.pyc' '*.pyo')"
command -v rg >/dev/null
if rg -n --glob '*.go' '(python([0-9.]*)?|\.py([^A-Za-z0-9_]|$))' cmd internal schema; then
  exit 1
else
  rg_status=$?
  test "$rg_status" -eq 1
fi
'''

[tasks."skill:package"]
description = "Validate the standalone skill package and evals"
run = "go test ./cmd/autoreview -run '^TestSkill' -count=1"

[tasks."skill:publish:test"]
description = "Run offline skill publication fixture tests"
run = "bash scripts/test-skill-release.sh"

[tasks."skill:publish:check"]
description = "Validate skill publication automation"
depends = ["skill:publish:test"]
run = '''
set -e
bash -n scripts/test-skill-release.sh
bash -n scripts/verify-published-skill.sh
shellcheck -s bash scripts/test-skill-release.sh
shellcheck -s bash scripts/verify-published-skill.sh
actionlint .github/workflows/publish-skill.yml
'''

[tasks."verify:release"]
description = "Run complete v0.1 source-release gates, including live vulnerability data"
depends = ["verify", "test:integration", "vuln", "build:cross", "runtime:go-only", "skill:package"]

[tasks."release:check"]
description = "Validate release and GitHub Actions configuration"
depends = ["installer:check"]
run = '''
set -e
actionlint
goreleaser check
bash -n scripts/verify-apple-credentials.sh
bash -n scripts/verify-apple-release.sh
'''

[tasks."release:snapshot"]
description = "Build and inspect unpublished release archives"
depends = ["release:check"]
run = '''
set -e
goreleaser release --snapshot --clean --skip=publish,sign
test "$(find dist -maxdepth 1 -name 'autoreview_*.tar.gz' -type f | wc -l | tr -d ' ')" = "4"
test "$(find dist -maxdepth 1 -name 'autoreview_*_linux_amd64.tar.gz' -type f | wc -l | tr -d ' ')" = "1"
test "$(find dist -maxdepth 1 -name 'autoreview_*_linux_arm64.tar.gz' -type f | wc -l | tr -d ' ')" = "1"
for archive in dist/autoreview_*.tar.gz; do
  test "$(tar -tzf "$archive" | LC_ALL=C sort | tr '\n' ' ')" = "LICENSE README.md autoreview "
done
if rg -n 'xattr|com\.apple\.quarantine' dist/homebrew/Casks/autoreview.rb; then
  printf '%s\n' "generated Homebrew cask removes quarantine" >&2
  exit 1
else
  rg_status=$?
  test "$rg_status" -eq 1
fi
(cd dist && shasum -a 256 -c checksums.txt)
case "$(uname -s)-$(uname -m)" in
  Darwin-arm64) native_target='darwin_arm64' ;;
  Darwin-x86_64) native_target='darwin_amd64' ;;
  Linux-aarch64) native_target='linux_arm64' ;;
  Linux-x86_64) native_target='linux_amd64' ;;
  *) printf '%s\n' "unsupported snapshot host" >&2; exit 1 ;;
esac
native_binary="$(find dist -type f -path "*${native_target}*/autoreview" -print -quit)"
test -n "$native_binary"
"$native_binary" --version | grep -E '^autoreview v[0-9]+\.[0-9]+\.[0-9]+-snapshot-[0-9a-f]+ \([0-9a-f]{40}\)$'
'''

[tasks."skill:review"]
description = "Review the skill at the pinned Tessl quality threshold"
run = '''
set -e
test "$(tessl --version)" = "0.94.0"
TESSL_AUTO_UPDATE_INTERVAL_MINUTES=0 tessl skill lint skills/autoreview
TESSL_AUTO_UPDATE_INTERVAL_MINUTES=0 tessl review run --workspace uinaf --force --threshold 100 --label autoreview-2.1.0-tessl-0.94.0 skills/autoreview
'''
