[tools]
go = "1.26.2"

[env]
GOWORK = "off"

[tasks.fmt]
description = "Format Go sources"
run = "gofmt -w ."

[tasks."fmt:check"]
description = "Check Go source formatting"
run = "test -z \"$(gofmt -l .)\""

[tasks.test]
description = "Run unit tests"
# Git-backed tests spawn many subprocesses; cap parallelism to avoid process exhaustion.
run = "go test -p 4 -parallel 4 ./..."

[tasks."test:race"]
description = "Run unit tests with the race detector"
# macOS TSan can crash when multiple Git subprocess tests run concurrently.
run = "go test -race -p 1 -parallel 1 ./..."

[tasks.vet]
description = "Run Go static analysis"
run = "go vet ./..."

[tasks.build]
description = "Build the autoreview CLI"
run = "go build ./cmd/autoreview"

[tasks.verify]
description = "Run deterministic repository verification"
depends = ["fmt:check", "test", "test:race", "vet", "build"]
