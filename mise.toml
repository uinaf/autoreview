[tools]
go = "1.26.2"
rg = "15.2.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"

[env]
GOWORK = "off"

[tasks.fmt]
description = "Format Go sources"
run = "gofmt -w ."

[tasks."fmt:check"]
description = "Check Go source formatting"
run = "test -z \"$(gofmt -l .)\""

[tasks.test]
description = "Run unit tests"
# Git-backed tests spawn many subprocesses; cap parallelism to avoid process exhaustion.
run = "go test -p 4 -parallel 4 ./..."

[tasks."test:race"]
description = "Run unit tests with the race detector"
# macOS TSan can crash when multiple Git subprocess tests run concurrently.
run = "go test -race -p 1 -parallel 1 ./..."

[tasks.vet]
description = "Run Go static analysis"
run = "go vet ./..."

[tasks.build]
description = "Build the autoreview CLI"
run = "go build ./cmd/autoreview"

[tasks.verify]
description = "Run deterministic repository verification"
depends = ["fmt:check", "test", "test:race", "vet", "build"]

[tasks."test:integration"]
description = "Run CLI and scanner integration tests"
run = '''
set -e
command -v trufflehog >/dev/null || {
  printf '%s\n' "test:integration requires the trufflehog executable on PATH" >&2
  exit 1
}
go test ./cmd/autoreview -run '^TestBinaryEndToEndWithFakeCodex$' -count=1
AUTOREVIEW_REAL_TRUFFLEHOG=1 \
  go test ./internal/target \
  -run '^Test(TruffleHogScanner.*|CollectorDetectsCredentialInDeletedFile)$' \
  -count=1 -v
(cd testdata/v0.1-fixture/after && go test ./...)
'''

[tasks."test:current-checkout"]
description = "Opt in to freezing and scanning the current checkout"
run = '''
AUTOREVIEW_REAL_REPOSITORY=1 \
  go test ./internal/target \
  -run '^TestCollectorRealRepositorySmoke$' \
  -count=1 -v
'''

[tasks.vuln]
description = "Check reachable Go vulnerabilities"
run = "govulncheck ./..."

[tasks."build:cross"]
description = "Cross-compile supported source targets"
run = '''
set -e
GOOS=darwin GOARCH=amd64 go build -o /tmp/autoreview-darwin-amd64 ./cmd/autoreview
GOOS=darwin GOARCH=arm64 go build -o /tmp/autoreview-darwin-arm64 ./cmd/autoreview
GOOS=linux GOARCH=amd64 go build -o /tmp/autoreview-linux-amd64 ./cmd/autoreview
GOOS=linux GOARCH=arm64 go build -o /tmp/autoreview-linux-arm64 ./cmd/autoreview
'''

[tasks."runtime:go-only"]
description = "Reject Python runtime files and invocation"
run = '''
set -e
test -z "$(git ls-files '*.py' '*.pyc' '*.pyo')"
command -v rg >/dev/null
if rg -n --glob '*.go' '(python([0-9.]*)?|\.py([^A-Za-z0-9_]|$))' cmd internal schema; then
  exit 1
else
  rg_status=$?
  test "$rg_status" -eq 1
fi
'''

[tasks."skill:package"]
description = "Validate the standalone skill package and evals"
run = "go test ./cmd/autoreview -run '^TestSkill' -count=1"

[tasks."verify:release"]
description = "Run complete v0.1 source-release gates, including live vulnerability data"
depends = ["verify", "test:integration", "vuln", "build:cross", "runtime:go-only", "skill:package"]

[tasks."skill:review"]
description = "Review the skill at the pinned Tessl quality threshold"
run = '''
set -e
test "$(tessl --version)" = "0.94.0"
TESSL_AUTO_UPDATE_INTERVAL_MINUTES=0 tessl skill lint skills/autoreview
TESSL_AUTO_UPDATE_INTERVAL_MINUTES=0 tessl review run --workspace uinaf --force --threshold 100 --label autoreview-0.1.0-tessl-0.94.0 skills/autoreview
'''
