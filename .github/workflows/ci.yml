name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check diff and classify changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify --quiet "${base_sha}^{commit}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          while IFS= read -r -d '' path; do
            case "$path" in
              README.md|CONTRIBUTING.md|SECURITY.md|LICENSE|docs/**) ;;
              *) docs_only=false; break ;;
            esac
          done < <(git diff --name-only --no-renames -z "$base_sha" HEAD)
          if [[ "$docs_only" == "true" ]]; then
            git diff --check "$base_sha" HEAD
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  verify:
    name: verify (${{ matrix.os }})
    needs: [classify]
    if: ${{ needs.classify.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Verify pull request
        if: ${{ github.event_name == 'pull_request' }}
        run: mise run verify

      - name: Verify release gates
        if: ${{ github.event_name == 'push' }}
        run: mise run verify:release

  package:
    name: package snapshot
    needs: [classify, verify]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Build release snapshot
        run: mise run release:snapshot

  release:
    name: release
    needs: [verify, package]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    timeout-minutes: 45
    environment:
      name: release
      deployment: false
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UINAF_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UINAF_RELEASE_APP_PRIVATE_KEY }}
          owner: uinaf
          repositories: |
            autoreview
            homebrew-tap
          permission-contents: write

      # GitHub links bot commits when the noreply email uses `{user-id}+{slug}[bot]@…`.
      - name: Resolve release bot identity
        id: release-bot-identity
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          APP_SLUG: ${{ steps.release-bot.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          if [[ ! "$user_id" =~ ^[0-9]+$ ]]; then
            echo "failed to resolve numeric bot user id for ${APP_SLUG}[bot]" >&2
            exit 1
          fi
          echo "user-id=${user_id}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Evaluate release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.8
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            @semantic-release/github@12.0.9
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.release-bot.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.release-bot-identity.outputs.user-id }}+${{ steps.release-bot.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.release-bot.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.release-bot-identity.outputs.user-id }}+${{ steps.release-bot.outputs.app-slug }}[bot]@users.noreply.github.com

      - name: Fetch release tags
        run: git fetch --tags --force

      - name: Detect release tag at HEAD
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if tag=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "unsupported release tag at HEAD: $tag" >&2
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install GoReleaser
        if: steps.tag.outputs.present == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Validate signing bootstrap
        if: steps.tag.outputs.present == 'true'
        shell: bash
        env:
          UINAF_RELEASE_AGE_KEY: ${{ secrets.UINAF_RELEASE_AGE_KEY }}
          UINAF_VAULT_DEPLOY_KEY: ${{ secrets.UINAF_VAULT_DEPLOY_KEY }}
          UINAF_EXPECTED_APPLE_TEAM_ID: ${{ vars.UINAF_EXPECTED_APPLE_TEAM_ID }}
          UINAF_VAULT_SIGNING_REF: ${{ vars.UINAF_VAULT_SIGNING_REF }}
        run: |
          set -euo pipefail
          test -n "$UINAF_RELEASE_AGE_KEY"
          test -n "$UINAF_VAULT_DEPLOY_KEY"
          [[ "$UINAF_EXPECTED_APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$UINAF_VAULT_SIGNING_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out encrypted signing payload
        if: steps.tag.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: uinaf/vault
          ref: ${{ vars.UINAF_VAULT_SIGNING_REF }}
          path: .release-vault
          fetch-depth: 1
          persist-credentials: false
          ssh-key: ${{ secrets.UINAF_VAULT_DEPLOY_KEY }}
          sparse-checkout: secrets/shared/uinaf-macos-release-signing.sops.json
          sparse-checkout-cone-mode: false

      - name: Install SOPS
        if: steps.tag.outputs.present == 'true'
        uses: mdgreenwald/mozilla-sops-action@55177c1ff20a2b396280e4c5f53c32b69f0c1e40 # v2.1.1
        with:
          version: v3.13.3

      - name: Publish release artifacts
        if: steps.tag.outputs.present == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
          HOMEBREW_TAP_TOKEN: ${{ steps.release-bot.outputs.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_BOT_NAME: ${{ steps.release-bot.outputs.app-slug }}[bot]
          RELEASE_BOT_EMAIL: ${{ steps.release-bot-identity.outputs.user-id }}+${{ steps.release-bot.outputs.app-slug }}[bot]@users.noreply.github.com
          EXPECTED_APPLE_TEAM_ID: ${{ vars.UINAF_EXPECTED_APPLE_TEAM_ID }}
          SOPS_AGE_KEY: ${{ secrets.UINAF_RELEASE_AGE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SOPS_AGE_KEY"
          payload=.release-vault/secrets/shared/uinaf-macos-release-signing.sops.json
          ./scripts/verify-apple-payload.sh "$payload"
          printf -v verify_command \
            'unset SOPS_AGE_KEY; ./scripts/verify-apple-credentials.sh %q' \
            "$EXPECTED_APPLE_TEAM_ID"
          sops exec-env --same-process \
            "$payload" \
            "$verify_command"
          sops exec-env --same-process \
            "$payload" \
            'unset SOPS_AGE_KEY; exec goreleaser release --clean'

      - name: Verify checksums and signature
        if: steps.tag.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 -c checksums.txt)
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/uinaf/autoreview/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/checksums.txt

      - name: Verify Apple signatures
        if: steps.tag.outputs.present == 'true'
        env:
          EXPECTED_APPLE_TEAM_ID: ${{ vars.UINAF_EXPECTED_APPLE_TEAM_ID }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
        run: ./scripts/verify-apple-release.sh

      - name: Attest build provenance
        if: steps.tag.outputs.present == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/autoreview_*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sigstore.json

      - name: Smoke Homebrew installation
        if: steps.tag.outputs.present == 'true'
        env:
          EXPECTED_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          brew tap uinaf/tap
          brew update
          brew install --cask uinaf/tap/autoreview
          autoreview --version | grep -F "autoreview ${EXPECTED_TAG}"
